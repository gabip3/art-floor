<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review | Art Floor</title>
  <meta name="description" content="Loved your new floor, shower, or backsplash? Leave Art Floor a quick review on Google." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/web/logo-mark.png" />

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=boska@700&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { overflow-x: hidden; }
    .review-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--green); position: relative; overflow: hidden; padding: clamp(28px, 6vw, 60px) var(--edge);
    }
    .review-card { position: relative; z-index: 1; max-width: 560px; width: 100%; text-align: center; }
    .review-logo { height: 44px; width: auto; margin: 0 auto clamp(32px, 6vw, 52px); display: block; }
    .review-stars { display: flex; justify-content: center; gap: 6px; margin-bottom: 22px; }
    .review-stars svg { width: 26px; height: 26px; }
    .review-eyebrow { font-family: var(--sans); font-size: .78rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--coral); margin-bottom: 16px; }
    .review-title { font-family: var(--serif); font-weight: 700; font-size: clamp(2.1rem, 6vw, 3.2rem); line-height: 1.08; letter-spacing: -.01em; color: #fff; margin-bottom: 20px; }
    .review-lead { font-family: var(--sans); font-size: clamp(1rem, 2vw, 1.12rem); line-height: 1.6; color: rgba(255,255,255,.82); max-width: 44ch; margin: 0 auto clamp(32px, 5vw, 44px); }
    .review-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      background: var(--coral); color: #fff; font-family: var(--sans); font-weight: 600; font-size: 1.05rem;
      padding: 18px 36px; border-radius: 100px; transition: transform .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
      box-shadow: var(--shadow-sm);
    }
    .review-btn:hover { background: var(--coral-2); transform: translateY(-2px); }
    .review-btn svg { flex: none; }
    .review-foot { margin-top: clamp(32px, 5vw, 48px); }
    .review-foot p { font-family: var(--sans); font-size: .92rem; color: rgba(255,255,255,.6); margin-bottom: 6px; }
    .review-foot a { color: rgba(255,255,255,.85); font-weight: 600; }
    .review-foot a:hover { color: var(--coral); }
    @media (max-width: 480px) {
      .review-btn { width: 100%; padding: 18px 24px; }
    }
  </style>
</head>
<body>

<section class="review-page tiletex">
  <div class="review-card">
    <img class="review-logo" src="assets/web/logo-horizontal-white.png" alt="Art Floor" width="1224" height="560" />

    <div class="review-stars" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#BC5A2D"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
      <svg viewBox="0 0 24 24" fill="#BC5A2D"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
      <svg viewBox="0 0 24 24" fill="#BC5A2D"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
      <svg viewBox="0 0 24 24" fill="#BC5A2D"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
      <svg viewBox="0 0 24 24" fill="#BC5A2D"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
    </div>

    <p class="review-eyebrow">Thank you</p>
    <h1 class="review-title">Loved the work?</h1>
    <p class="review-lead">
      A quick review on Google means the world to our small business,
      and it helps your neighbors find us too. It only takes a minute.
    </p>

    <a class="review-btn" href="https://g.page/r/CRa8ii1YJ2ZiEAI/review" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="#fff" d="M21.6 12.23c0-.76-.07-1.5-.19-2.2H12v4.17h5.4a4.6 4.6 0 0 1-2 3.02v2.5h3.23c1.9-1.75 2.97-4.32 2.97-7.49z"/>
        <path fill="#fff" d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.24-2.5c-.9.6-2.05.96-3.39.96-2.6 0-4.8-1.76-5.6-4.12H3.06v2.59A10 10 0 0 0 12 22z"/>
        <path fill="#fff" d="M6.4 13.91a6 6 0 0 1 0-3.82V7.5H3.06a10 10 0 0 0 0 9l3.34-2.59z"/>
        <path fill="#fff" d="M12 5.98c1.47 0 2.79.5 3.82 1.5l2.87-2.87A9.9 9.9 0 0 0 12 2a10 10 0 0 0-8.94 5.5l3.34 2.59c.8-2.36 3-4.11 5.6-4.11z"/>
      </svg>
      Leave a Google Review
    </a>

    <div class="review-foot">
      <p>Prefer to call instead?</p>
      <a href="tel:+14704376447">(470) 437-6447</a>
    </div>
  </div>
</section>

</body>
</html>
