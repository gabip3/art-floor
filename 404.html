<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found - Art Floor LLC</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/web/logo.svg" />
  <style>
    :root { --slate:#2E4A57; --terra:#BC5A2D; --paper:#F5EFE2; }
    * { margin:0; box-sizing:border-box; }
    body { min-height:100dvh; display:grid; place-items:center; text-align:center;
      background:var(--slate); color:var(--paper); padding:32px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    img { width:96px; height:96px; margin:0 auto 36px; display:block; }
    .code { font-size:.8rem; letter-spacing:.24em; text-transform:uppercase; color:var(--terra); font-weight:700; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; font-size:clamp(2rem,7vw,3.4rem); line-height:1.05; margin:16px 0 14px; }
    p { color:rgba(245,239,226,.8); max-width:44ch; margin:0 auto 32px; line-height:1.6; }
    a.btn { display:inline-block; background:var(--paper); color:var(--slate); font-weight:600;
      padding:15px 30px; border-radius:100px; transition:background .3s, color .3s; text-decoration:none; }
    a.btn:hover { background:var(--terra); color:#fff; }
    a.tel { display:block; margin-top:22px; color:rgba(245,239,226,.7); font-size:.95rem; text-decoration:none; }
    a.tel strong { color:var(--paper); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/web/logo.svg" alt="Art Floor LLC" />
    <p class="code">Error 404</p>
    <h1>This page took a wrong turn.</h1>
    <p>The page you’re looking for isn’t here - but your new floor could be. Let’s get you back on track.</p>
    <a class="btn" href="/">Back to home</a>
    <a class="tel" href="tel:+14704376447">Or call us - <strong>(470) 437-6447</strong></a>
  </main>
</body>
</html>
