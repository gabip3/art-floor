# ⚠️ INERTE: este site está hospedado no GitHub Pages, não no Netlify.
# O GitHub Pages NÃO lê este arquivo, nenhuma das regras abaixo (cache, headers)
# é aplicada em produção. Mantido apenas como referência caso o site volte a ser
# hospedado no Netlify no futuro. Os headers de segurança reais hoje são
# aplicados via <meta> tags no <head> de cada página HTML.
#
# Netlify configuration, static site, no build step
[build]
  publish = "."

# Images: short cache + revalidate so photo swaps show up quickly
[[headers]]
  for = "/assets/web/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

# Sensible security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
